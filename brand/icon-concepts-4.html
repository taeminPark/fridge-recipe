<title>있잖아 아이콘 4차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 아이콘 시안 4차: "있는 재료 → 할 수 있는 요리". 앱 바탕(숯) 위에 큰 아이콘과 실제 크기. 페이지는 어두운 한 가지 모습 */
:root {
  color-scheme: dark;
  --bg: #1C1918; --card: #282423; --ink: #F3EEE9; --soft: #A79E97; --acc: #F5A869; --line: rgb(243 238 233 / .12);
  --f-title: "Jua", "Noto Sans KR", sans-serif; --f-body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); word-break: keep-all; padding: 28px 16px 64px }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 36px }
h1 { font: 400 32px/1.25 var(--f-title); margin: 0 }
.lead { color: var(--soft); margin: 8px 0 0; line-height: 1.65; max-width: 64ch }
h2 { font: 400 25px/1.3 var(--f-title); margin: 0 0 12px; color: var(--acc) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px }
.top { display: flex; gap: 16px; align-items: center }
.top > svg { width: 136px; height: 136px; border-radius: 31px; flex: none; box-shadow: 0 14px 28px -12px #000, 0 0 0 1px rgb(255 255 255 / .06) }
.item h3 { margin: 0 0 6px; font: 400 20px var(--f-title) }
.flow { font-size: 12.5px; color: var(--acc); font-weight: 500 }
.item p { margin: 0; color: var(--soft); font-size: 13.5px; line-height: 1.6 }
.sizes { display: flex; align-items: flex-end; gap: 12px; color: var(--soft); font-size: 11px }
.sizes figure { margin: 0; display: grid; justify-items: center; gap: 4px }
.s60 svg { width: 60px; height: 60px; border-radius: 14px; display: block }
.s32 svg { width: 32px; height: 32px; border-radius: 7px; display: block }
.s16 svg { width: 16px; height: 16px; border-radius: 3px; display: block }
.light { background: #F2F2F2; padding: 6px; border-radius: 10px }
@media (max-width: 420px) { .top { flex-direction: column; align-items: flex-start } }
.home { border-radius: 28px; padding: 22px 18px; background: linear-gradient(160deg, #3A4A6B, #6B4E6E 55%, #B8846B); display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 18px 10px }
.app { display: grid; justify-items: center; gap: 5px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgb(0 0 0 / .4) }
.app svg, .app i { width: 60px; height: 60px; border-radius: 14px; display: block }
.app i { background: rgb(255 255 255 / .22) }
.ask { border: 1px solid var(--acc); border-radius: 18px; padding: 18px 20px; line-height: 1.75; background: var(--card) }
.ask b { color: var(--acc) }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2523"/><stop offset="1" stop-color="#171413"/></linearGradient>
    <linearGradient id="bowlG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E58C4F"/><stop offset=".45" stop-color="#F8B67D"/><stop offset="1" stop-color="#D8793C"/></linearGradient>
    <linearGradient id="fridgeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBF7F2"/><stop offset="1" stop-color="#DDD3C9"/></linearGradient>
    <radialGradient id="glowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F5A869" stop-opacity=".32"/><stop offset="1" stop-color="#F5A869" stop-opacity="0"/></radialGradient>
    <radialGradient id="yolkG" cx=".38" cy=".34" r=".75"><stop offset="0" stop-color="#FFD9A8"/><stop offset=".4" stop-color="#F9B061"/><stop offset="1" stop-color="#E5832F"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
</svg>

<div class="wrap">
  <header>
    <h1>있잖아 아이콘 4차: 있는 재료로, 할 수 있는 요리</h1>
    <p class="lead">"냉장고에 있는 재료"가 "지금 만들 수 있는 요리"가 되는 순간을 담았어요. 색은 앱에 적용한 숯 + 살구예요. 각 아이콘 옆에 홈 화면(60), 탭(32, 16), 밝은 바탕에서의 모습을 함께 두었어요.</p>
  </header>

  <section>
    <h2>콘셉트 6개</h2>
    <div class="grid" id="icons"></div>
  </section>

  <section>
    <h2>홈 화면에서</h2>
    <div class="home" id="home"></div>
  </section>

  <div class="ask">마음에 드는 번호를 알려주세요. 예: <b>"3"</b>, <b>"1에 5의 체크 추가"</b>처럼 섞어도 돼요. 고르시면 앱 아이콘, 파비콘, 헤더 마크를 한 번에 바꿀게요.</div>
</div>

<script>
const BG = `<rect width="256" height="256" fill="url(#bgG)"/>`
const C = { acc: '#F5A869', accD: '#D8793C', ink: '#F3EEE9', bg: '#1C1918', green: '#8CC48A', greenD: '#5E9A62', red: '#EE6A50', carrot: '#F28A3C' }
// 그릇 (가운데 x, 위 테두리 y, 반폭 w)
const bowl = (x, y, w) => `<g filter="url(#sh)"><path d="M${x - w} ${y}H${x + w}C${x + w} ${y + w * .9} ${x + w * .55} ${y + w * 1.05} ${x + w * .4} ${y + w * 1.05}H${x - w * .4}C${x - w * .55} ${y + w * 1.05} ${x - w} ${y + w * .9} ${x - w} ${y}Z" fill="url(#bowlG)"/>
  <rect x="${x - w - 6}" y="${y - 7}" width="${2 * w + 12}" height="14" rx="7" fill="#FBC495"/>
  <path d="M${x - w * .66} ${y + w * .3}C${x - w * .6} ${y + w * .62} ${x - w * .42} ${y + w * .8} ${x - w * .2} ${y + w * .86}" fill="none" stroke="#FFE2C6" stroke-opacity=".55" stroke-width="${Math.max(5, w * .1)}" stroke-linecap="round"/></g>`
const steam = (xs, y1, h, w = 10, op = .7) => xs.map(x => `<path d="M${x} ${y1} q-10 ${-h / 4} 0 ${-h / 2} t0 ${-h / 2}" fill="none" stroke="${C.ink}" stroke-opacity="${op}" stroke-width="${w}" stroke-linecap="round"/>`).join('')
// 작은 재료들
const egg = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="17" ry="22" fill="${C.ink}"/><ellipse cx="-5" cy="-8" rx="4" ry="6" fill="#fff" opacity=".8"/></g>`
const tomato = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><circle r="18" fill="${C.red}"/><path d="M-9 -16l9 5 9-5-4 9h-10z" fill="${C.green}"/><circle cx="-6" cy="-3" r="4" fill="#fff" opacity=".35"/></g>`
const leaf = (x, y, s = 1, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0 22C-16 8-14-12 0-24 14-12 16 8 0 22z" fill="${C.green}"/><path d="M0 18V-18" stroke="${C.greenD}" stroke-width="3" stroke-linecap="round"/></g>`
const carrot = (x, y, s = 1, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M-9 -16h18l-7 38a2 2 0 0 1-4 0z" fill="${C.carrot}"/><path d="M-5 -16l-4-12M0 -16v-14M5 -16l4-12" stroke="${C.green}" stroke-width="4" stroke-linecap="round"/></g>`
const check = (pts, w, color = C.acc) => `<path d="${pts}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`

const ICONS = [
  ['1 냉장고에서 나온 한 그릇', '냉장고 → 요리',
    '냉장고 문이 열리고, 그 앞에 김 나는 한 그릇이 놓여 있어요. "냉장고에 있는 걸로 한 그릇"이라는 앱의 약속 그대로예요.',
    `${BG}<circle cx="150" cy="170" r="100" fill="url(#glowG)"/>
     <g filter="url(#sh)"><rect x="40" y="34" width="96" height="176" rx="14" fill="url(#fridgeG)"/><rect x="40" y="96" width="96" height="6" fill="#BFB3A8"/>
       <rect x="118" y="54" width="7" height="26" rx="3.5" fill="#BFB3A8"/><rect x="118" y="116" width="7" height="34" rx="3.5" fill="#BFB3A8"/></g>
     ${steam([150, 182], 140, 52, 9)}
     ${bowl(166, 160, 54)}`],
  ['2 재료가 모여 한 그릇', '재료 3개 → 그릇',
    '계란, 토마토, 잎채소가 그릇으로 퐁당 들어가요. 요리찾기 로딩 화면(재료가 냄비에 빠지는 장면)과 같은 이야기예요.',
    `${BG}<circle cx="128" cy="160" r="100" fill="url(#glowG)"/>
     ${tomato(84, 74, 1.15)}${egg(132, 56, 1.05)}${leaf(178, 78, 1.1, 24)}
     <path d="M96 104l8 14M132 90v20M168 106l-8 14" stroke="${C.ink}" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
     ${bowl(128, 146, 80)}`],
  ['3 그릇 속 체크', '있다! → 된다',
    '그릇 안에 체크 표시가 담겨 있어요. "있는 재료로 된다"는 확인. 지금 아이콘의 체크를 이어받아 가장 단순하고 작은 크기에서도 또렷해요.',
    `${BG}<circle cx="128" cy="140" r="104" fill="url(#glowG)"/>
     ${bowl(128, 120, 86)}
     ${check('M84 100 116 132 178 58', 22, C.ink)}`],
  ['4 재료 체크리스트', '있음 ✓ 있음 ✓ → 요리',
    '메모지에 재료 두 개가 체크돼 있고, 마지막 줄은 그릇이에요. 장보기 목록이 아니라 "이미 있는 것" 목록이라는 뜻이에요.',
    `${BG}
     <g filter="url(#sh)"><rect x="46" y="30" width="164" height="196" rx="18" fill="${C.ink}"/>
       <rect x="96" y="22" width="64" height="20" rx="6" fill="${C.acc}" opacity=".9"/></g>
     ${check('M72 82 84 94 104 70', 10)}<rect x="118" y="76" width="66" height="12" rx="6" fill="#CFC4B9"/>
     ${check('M72 130 84 142 104 118', 10)}<rect x="118" y="124" width="52" height="12" rx="6" fill="#CFC4B9"/>
     <path d="M70 172h44c0 20-10 30-22 30s-22-10-22-30z" fill="${C.accD}"/><rect x="66" y="166" width="52" height="9" rx="4.5" fill="${C.acc}"/>
     <rect x="128" y="178" width="58" height="12" rx="6" fill="${C.acc}"/>`],
  ['5 냉장고 손잡이 숟가락', '냉장고 + 숟가락',
    '냉장고 문 손잡이가 숟가락이에요. 냉장고(있는 재료)와 숟가락(요리)이 하나의 모양 안에 있어 가장 기발하고 기억에 남아요.',
    `${BG}<circle cx="128" cy="128" r="104" fill="url(#glowG)"/>
     <g filter="url(#sh)"><rect x="62" y="26" width="132" height="204" rx="20" fill="url(#fridgeG)"/>
       <rect x="62" y="98" width="132" height="7" fill="#BFB3A8"/></g>
     <ellipse cx="164" cy="128" rx="14" ry="19" fill="${C.acc}"/>
     <rect x="159" y="142" width="10" height="64" rx="5" fill="${C.acc}"/>
     <rect x="159" y="48" width="10" height="34" rx="5" fill="${C.acc}"/>
     <ellipse cx="160" cy="122" rx="4" ry="6" fill="#fff" opacity=".55"/>`],
  ['6 도마 위의 있는 재료', '재료 → 칼질 시작',
    '둥근 도마 위에 계란, 당근, 잎채소가 놓여 있어요. 막 요리를 시작하려는 장면. 살구색 도마가 테마 색과 잘 이어져요.',
    `${BG}
     <g filter="url(#sh)"><circle cx="122" cy="134" r="92" fill="${C.acc}"/><circle cx="122" cy="134" r="80" fill="#F8B67D"/>
       <rect x="200" y="122" width="40" height="24" rx="12" fill="${C.accD}"/><circle cx="226" cy="134" r="6" fill="${C.bg}" opacity=".5"/></g>
     ${egg(92, 108, 1.15)}${carrot(144, 150, 1.25, 40)}${leaf(96, 170, 1, -30)}${tomato(150, 96, .95)}`],
]

const icon = body => `<svg viewBox="0 0 256 256" aria-hidden="true">${body}</svg>`
document.getElementById('icons').innerHTML = ICONS.map(([name, flow, desc, body]) => `
  <div class="item"><div class="top">${icon(body)}<div><h3>${name}</h3><div class="flow">${flow}</div></div></div>
    <p>${desc}</p>
    <div class="sizes"><figure class="s60">${icon(body)}60</figure><figure class="s32">${icon(body)}32</figure><figure class="s16">${icon(body)}16</figure><figure class="s32 light">${icon(body)}</figure></div>
  </div>`).join('')
document.getElementById('home').innerHTML = ICONS.map(([name, , , body]) => `<div class="app">${icon(body)}${name.split(' ')[0]}번</div>`).join('') +
  ['사진', '카메라', '메모', '날씨', '지도', '음악'].map(n => `<div class="app"><i></i>${n}</div>`).join('')
</script>
